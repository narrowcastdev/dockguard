version: "3"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: supersecret
      POSTGRES_USER: myapp
    ports:
      - "5432:5432"
    restart: always
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    privileged: true
