services:
  redis:
    image: redis:7
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    healthcheck:
      disable: false

  wireguard:
    image: ghcr.io/wg-easy/wg-easy
    networks:
      wg:
        ipv4_address: 10.42.42.42

  app:
    image: myapp:latest
    networks:
      - frontend
      - backend
